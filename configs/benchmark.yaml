# Erlanger Träger benchmark (scripts/run_benchmark.py).  Any value can be overridden on the
# command line, e.g.  totals=[500] seeds=[42] mould_it.epochs=5

modalities: [pressure_only, pt_us]   # single-modal (pressure), multi-modal (pressure, temperature, US1, US4)
totals: [50, 100, 200, 500, 1000, 2000, 4000, 8000, 16000]   # dataset sizes, rounded down per class
seeds: [42, 123, 456]
holdout: null       # failure modes to hold out (null: every mode); the classification fold always runs
device: cuda        # cuda or cpu

quantile: 95        # validation percentile behind every threshold (5 % false positive rate)
code_dim: 32        # MouldIt latent size = number of PCA components

knn:
  n_neighbors: 5

fidelity:
  dtw_band: 0.10    # Sakoe-Chiba band of the DTW alignment, fraction of the cycle length

mould_it:
  epochs: 1000
  cls_weight: 0.1
  # beta = 2 sigma_OK^2 / (C T), sigma_OK from 300 OK cycles at seed 42 (MouldItRunner.kld_beta)
  beta:
    pressure_only: 5.4e-6
    pt_us: 9.4e-7
  weight_decay: 0.0
  lr: 1.0e-3
  batch_size: 32
  recon_weight: 1.0
  architecture: tcn_attention   # src/mouldit_benchmark/models/configs/<name>.yaml

out: null           # null: results/erlanger_traeger_benchmark/
wandb:
  enabled: false
  project: mouldit_benchmark
  entity: null      # null: your default W&B entity
