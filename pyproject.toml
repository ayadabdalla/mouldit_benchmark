[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mouldit-benchmark"
version = "1.0.0"
description = "MouldIt: data efficiency of multi-task temporal representation learning in injection moulding"
authors = [{name = "Abdullah Ayad"}]
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "matplotlib>=3.8",
    "omegaconf>=2.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
wandb = ["wandb"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mouldit_benchmark.models" = ["configs/*.yaml"]
